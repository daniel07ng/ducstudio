<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duc – web & ArchiCAD</title>
<meta name="description" content="Jednoduchá webová tvorba a práce v ArchiCADu / Simple web design and ArchiCAD work / Thiết kế web đơn giản và ArchiCAD">
<style>
  :root {
    --navy: #0f1b33;
    --navy-2: #16274a;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #17203a;
    --muted: #5a6479;
    --accent: #2f6fed;
    --accent-dark: #2358c7;
    --accent-soft: #e8efff;
    --border: #e1e5ee;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15,27,51,.05), 0 8px 24px rgba(15,27,51,.06);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15,27,51,.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
  .logo { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 700; letter-spacing: .2px; }
  .logo-mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #4f8bff, #2358c7);
    display: grid; place-items: center; font-size: .95rem; color: #fff;
  }
  nav { display: flex; gap: 6px; }
  nav a {
    color: #c9d3ea; text-decoration: none; font-weight: 500; font-size: .95rem;
    padding: 8px 12px; border-radius: 8px; transition: background .2s, color .2s;
  }
  nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
  .lang { display: flex; background: rgba(255,255,255,.08); border-radius: 9px; padding: 3px; }
  .lang button {
    border: 0; background: transparent; color: #c9d3ea; cursor: pointer;
    padding: 5px 10px; border-radius: 7px; font: 600 .8rem/1 inherit; letter-spacing: .5px;
    transition: background .2s, color .2s;
  }
  .lang button:hover { color: #fff; }
  .lang button.active { background: #fff; color: var(--navy); }

  /* Hero */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    background:
      radial-gradient(900px 400px at 85% -10%, rgba(79,139,255,.35), transparent 60%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 90%);
            mask-image: linear-gradient(180deg, #000 0%, transparent 90%);
  }
  .hero-inner { position: relative; padding: 96px 0 104px; display: grid; gap: 48px; grid-template-columns: 1.4fr 1fr; align-items: center; }
  .eyebrow {
    display: inline-block; font-size: .8rem; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: #9fc0ff; background: rgba(79,139,255,.15); border: 1px solid rgba(159,192,255,.25);
    padding: 6px 12px; border-radius: 999px; margin-bottom: 20px;
  }
  .hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.6rem); line-height: 1.1; margin: 0 0 18px; letter-spacing: -.5px; }
  .hero p { font-size: 1.15rem; color: #c3cee8; max-width: 540px; margin: 0 0 32px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600;
    padding: 13px 24px; border-radius: 10px; transition: transform .15s, background .2s, border-color .2s;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(47,111,237,.4); }
  .btn-primary:hover { background: #4a82f5; transform: translateY(-1px); }
  .btn-ghost { color: #fff; border: 1px solid rgba(255,255,255,.28); }
  .btn-ghost:hover { border-color: #fff; }

  .hero-card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px; padding: 28px; backdrop-filter: blur(6px);
  }
  .hero-card .avatar {
    width: 72px; height: 72px; border-radius: 50%; margin-bottom: 18px;
    background: linear-gradient(135deg, #4f8bff, #2358c7);
    display: grid; place-items: center; font-size: 1.8rem; font-weight: 700;
  }
  .hero-card h3 { margin: 0 0 4px; font-size: 1.2rem; }
  .hero-card .role { color: #9fb0d4; margin: 0 0 18px; font-size: .95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: .82rem; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.1); color: #dbe5fa; }

  /* Sections */
  section { padding: 88px 0 8px; }
  .label { color: var(--accent); font-weight: 700; font-size: .8rem; letter-spacing: 1.4px; text-transform: uppercase; margin: 0 0 10px; }
  h2 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); margin: 0 0 12px; letter-spacing: -.3px; line-height: 1.2; }
  .lead { color: var(--muted); max-width: 620px; margin: 0 0 40px; font-size: 1.05rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px; box-shadow: var(--shadow); transition: transform .2s, border-color .2s;
  }
  .card:hover { transform: translateY(-4px); border-color: #c5d6fb; }
  .icon {
    width: 52px; height: 52px; border-radius: 13px; background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; margin-bottom: 20px;
  }
  .icon svg { width: 26px; height: 26px; }
  .card h3 { margin: 0 0 10px; font-size: 1.25rem; }
  .card p { margin: 0 0 20px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { font-size: .8rem; font-weight: 600; color: var(--accent-dark); background: var(--accent-soft); padding: 4px 10px; border-radius: 6px; }

  /* Contact */
  .contact {
    display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff; border-radius: 20px; padding: 44px;
  }
  .contact h2 { margin-bottom: 8px; }
  .contact p { color: #c3cee8; margin: 0; max-width: 460px; }
  .mail { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .mail small { color: #9fb0d4; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; font-size: .75rem; }
  .mail a.addr { font-size: 1.1rem; font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.35); }
  .mail a.addr:hover { border-color: #fff; }

  footer { padding: 40px 0 48px; color: var(--muted); font-size: .9rem; }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 24px; }

  @media (max-width: 820px) {
    .hero-inner { grid-template-columns: 1fr; padding: 64px 0 72px; gap: 32px; }
    nav { display: none; }
    section { padding-top: 64px; }
    .contact { padding: 32px 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>

  <div class="wrap">

    </section>

    <section id="contact">
      <div class="contact">
        <div>
          <p class="label" style="color:#9fc0ff" data-i18n="nav_contact"></p>
          <h2 data-i18n="contact_title"></h2>

        </div>
        <div class="mail">
          <small data-i18n="contact_email"></small>
          <a class="addr" href="mailto:nguyenduc2837@gmail.com">nguyenduc2837@gmail.com</a>
          <a class="btn btn-primary" href="mailto:nguyenduc2837@gmail.com" data-i18n="contact_btn"></a>
        </div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> Duc</span>
    <span data-i18n="footer_note"></span>
  </div>
</footer>

<script>
  var translations = {
    cs: {
      nav_home: "Domů",
      nav_services: "Služby",
      nav_contact: "Kontakt",
      hero_eyebrow: "Student · Začínající podnikatel",
      hero_title: "Ahoj, jsem Duc",
      hero_text: "Jsem student střední školy, který chce podnikat a získat víc zkušeností.",
      hero_cta: "Napište mi",
      hero_cta2: "Moje služby",
      card_role: "Student střední školy",
      services_title: "Služby, které poskytuji",
      services_lead: "Dělám to, čemu rozumím, a na každou zakázku se soustředím naplno.",
      s1_title: "Jednoduchá webová tvorba",
      s1_text: "Vytvořím vám jednoduchou, přehlednou webovou stránku, která funguje na počítači i na mobilu.",
      s2_title: "Práce v ArchiCADu",
      s2_text: "Práce v programu ArchiCAD pro stavebnictví – například modelování a tvorba výkresů.",
      s2_tag: "Stavebnictví",
      contact_title: "Pojďme se domluvit",
      contact_text: "Máte zájem o moje služby nebo máte otázku? Napište mi a ozvu se vám.",
      contact_email: "E-mail",
      contact_btn: "Napsat e-mail",
      footer_note: "Webová stránka vytvořena s láskou k detailu"
    },
    en: {
      nav_home: "Home",
      nav_services: "Services",
      nav_contact: "Contact",
      hero_eyebrow: "Student · Aspiring entrepreneur",
      hero_title: "Hi, I'm Duc",
      hero_text: "I'm a high school student who wants to start a business and gain more experience.",
      hero_cta: "Write to me",
      hero_cta2: "My services",
      card_role: "High school student",
      services_title: "Services I offer",
      services_lead: "I do what I understand well, and I give every project my full attention.",
      s1_title: "Simple web design",
      s1_text: "I will build you a simple, clear website that works on both computers and phones.",
      s2_title: "ArchiCAD work",
      s2_text: "Work in ArchiCAD for the construction industry – for example modelling and drawing production.",
      s2_tag: "Construction",
      contact_title: "Let's work together",
      contact_text: "Interested in my services or have a question? Send me a message and I'll get back to you.",
      contact_email: "Email",
      contact_btn: "Send an email",
      footer_note: "Website made with attention to detail"
    },
    vi: {
      nav_home: "Trang chủ",
      nav_services: "Dịch vụ",
      nav_contact: "Liên hệ",
      hero_eyebrow: "Học sinh · Người khởi nghiệp trẻ",
      hero_title: "Xin chào, mình là Duc",
      hero_text: "Mình là học sinh trung học, muốn khởi nghiệp và tích lũy thêm kinh nghiệm.",
      hero_cta: "Nhắn cho mình",
      hero_cta2: "Dịch vụ của mình",
      card_role: "Học sinh trung học",
      services_title: "Dịch vụ mình cung cấp",
      services_lead: "Mình làm những việc mình hiểu rõ và dành toàn bộ sự tập trung cho mỗi dự án.",
      s1_title: "Thiết kế web đơn giản",
      s1_text: "Mình sẽ làm cho bạn một trang web đơn giản, rõ ràng, hiển thị tốt trên cả máy tính và điện thoại.",
      s2_title: "Làm việc với ArchiCAD",
      s2_text: "Sử dụng ArchiCAD cho ngành xây dựng – ví dụ như dựng mô hình và thực hiện bản vẽ.",
      s2_tag: "Xây dựng",
      contact_title: "Cùng trao đổi nhé",
      contact_text: "Bạn quan tâm đến dịch vụ của mình hoặc có câu hỏi? Hãy gửi tin nhắn, mình sẽ phản hồi sớm.",
      contact_email: "Email",
      contact_btn: "Gửi email",
      footer_note: "Trang web được làm tỉ mỉ từng chi tiết"
    }
  };

  function setLang(lang) {
    if (!translations[lang]) lang = "cs";
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = translations[lang][el.getAttribute("data-i18n")];
    });
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-lang") === lang);
    });
    try { localStorage.setItem("lang", lang); } catch (e) {}
  }

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });

  var saved = "cs";
  try { saved = localStorage.getItem("lang") || "cs"; } catch (e) {}
  setLang(saved);
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
